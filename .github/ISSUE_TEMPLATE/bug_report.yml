name: Bug report
description: Report a problem with Steppe.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include the Steppe version, macOS version, and
        Herdr version. Do not paste secrets or full session transcripts.
  - type: input
    id: version
    attributes:
      label: Steppe version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: herdr
    attributes:
      label: Herdr version and session
      placeholder: "herdr 0.9.3, default session"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Steppe
        2. Run `herdr attach`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets before pasting.
      render: text
